services:
  - type: web
    name: openclaw
    runtime: docker
    plan: starter
    dockerCommand: bash scripts/start-railway.sh
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: NODE_ENV
        value: "production"
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 1
